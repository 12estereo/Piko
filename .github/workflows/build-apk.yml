
name: Build DRONE DEFENDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DRONE_DEFENDER_Android_v1_1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto Android
        run: |
          test -f DRONE_DEFENDER_Android_v1_1.zip
          mkdir -p proyecto
          unzip -q -o DRONE_DEFENDER_Android_v1_1.zip -d proyecto
          test -f proyecto/DRONE_DEFENDER_Android_v1_1/settings.gradle.kts
          test -f proyecto/DRONE_DEFENDER_Android_v1_1/app/build.gradle.kts

      - name: Compilar DRONE DEFENDER
        working-directory: proyecto/DRONE_DEFENDER_Android_v1_1
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRONE-DEFENDER-v1.1-APK
          path: proyecto/DRONE_DEFENDER_Android_v1_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
