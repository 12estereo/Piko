
name: Build DRONE DEFENDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Instalar herramientas Android
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Buscar proyecto Gradle
        run: |
          echo "Repositorio Piko:"
          ls -la
          find . -maxdepth 5 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \)

      - name: Compilar DRONE DEFENDER
        run: |
          FILE=$(find . -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No existe un proyecto Gradle."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          cd "$DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRONE-DEFENDER-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
