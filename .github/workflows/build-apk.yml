
name: Build DRONE DEFENDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias
        run: yes | sdkmanager --licenses

      - name: Instalar Android SDK
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Buscar proyecto Gradle
        id: project
        run: |
          echo "Contenido del repositorio:"
          ls -la

          FILE=$(find . -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No se encontró settings.gradle"
            echo "Archivos encontrados:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Proyecto encontrado en: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar DRONE DEFENDER
        working-directory: .
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DRONE-DEFENDER-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
