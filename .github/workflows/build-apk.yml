
name: Build MATRIX CODE ZERO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MATRIX_CODE_ZERO_Android_v1_0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          test -f MATRIX_CODE_ZERO_Android_v1_0.zip
          mkdir -p proyecto
          unzip -q -o MATRIX_CODE_ZERO_Android_v1_0.zip -d proyecto
          test -f proyecto/settings.gradle.kts
          test -f proyecto/app/build.gradle.kts

      - name: Compilar APK
        working-directory: proyecto
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-CODE-ZERO-v1.0-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
